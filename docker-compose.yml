version: '3.8'

services:
  clientmanager-web:
    image: nginx:alpine
    container_name: clientmanager-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
